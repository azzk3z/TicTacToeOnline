
spring.application.name=tictactoe-backend

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tictactoe_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Password reset mail (SPRING_MAIL_HOST, SPRING_MAIL_PORT, and SMTP credentials)
app.password-reset.frontend-url=${APP_FRONTEND_URL:http://localhost:5173/}
app.password-reset.from=${RESET_MAIL_FROM:}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
